name: release

# Pushing a v* tag builds the libraries for every platform this SDK claims to support and attaches
# them to the release for that tag - as plain archives, and as an installer per platform: a DEB and
# an RPM, a Windows MSI built with WiX, and a macOS pkg. The manual trigger builds the same things
# from whatever main says without touching a release, which is how this workflow is tried out - and
# what the first release after it lands needs, since a workflow only runs for a tag if it already
# existed at that tag's commit.
#
# The installers are signed in the deploy job and nowhere else. They are built on three runners, and
# a signing key handed to all three would be exposed three times over for nothing: the packages come
# back as artifacts and are signed once, on one machine, with the key euclid-rui signs its APT
# repository with.
#
# It also runs on main, where it attaches nothing: that run exists to fill the dependency cache. A
# cache written while building a tag is scoped to that tag and invisible to the next one, so every
# release was rebuilding Boost from source - a quarter of an hour of a release spent on dependencies
# that had not changed. Caches written on the default branch are the ones every other ref can read,
# so main is the only place this cache can usefully be filled.
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

# One run per ref. A cache-filling run on main that a later push has already overtaken is building
# dependencies nothing is waiting for; a tag run is never cancelled, because its ref is its own.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # The same three platforms cpp.yml builds, minus the second Linux compiler: what is attached
        # here is a library rather than a proof that it compiles twice.
        include:
          - name: linux-x64
            os: ubuntu-latest
            extra: -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          - name: windows-x64
            os: windows-latest
            extra: -DVCPKG_TARGET_TRIPLET=x64-windows-static
          - name: macos-arm64
            os: macos-latest
            extra: ""

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gcc-14
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14

      - name: Create the vcpkg binary cache directory
        shell: bash
        run: mkdir -p "${{ github.workspace }}/vcpkg-bincache"

      - name: Cache the vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          # Release builds of the dependencies, which are not the Debug ones cpp.yml caches.
          key: vcpkg-release-${{ matrix.name }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-release-${{ matrix.name }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: vcpkg.json
          runVcpkgInstall: false

      # The tag is what somebody reads; version.txt is what the library reports as its own version
      # and what the archives are named after. If the two disagree, the tag is the one nobody can
      # check afterwards.
      - name: Check the tag against version.txt
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(cat version.txt)"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME says $tagged, version.txt says $declared" >&2
            exit 1
          fi

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                ${{ matrix.extra }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # Publishing something that was never tested is the one mistake this workflow could make that
      # nobody can take back: an archive attached to a tag can be deleted, never replaced in the
      # hands of whoever already fetched it.
      - name: Test
        env:
          BOOST_TEST_LOG_LEVEL: test_suite
        run: ctest --test-dir build --build-config Release --verbose --timeout 120

      - name: Stage the install tree
        shell: bash
        run: |
          version="$(cat version.txt)"
          stage="stage/euclid-cdk-${version}-${{ matrix.name }}"
          cmake --install build --config Release --prefix "$stage"
          # The two files somebody unpacking this will look for first, and neither is installed by
          # CMake: the licence the archive is under, and how to build against what is in it.
          cp LICENSE README.md "$stage/"
          echo "EUCLID_CDK_STAGE=$stage" >> "$GITHUB_ENV"
          echo "EUCLID_CDK_ARCHIVE=euclid-cdk-${version}-${{ matrix.name }}" >> "$GITHUB_ENV"

      # cmake -E tar rather than tar or Compress-Archive: one command that behaves the same on all
      # three runners, and it is already on every one of them.
      - name: Archive
        shell: bash
        working-directory: stage
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -E tar cf "../${EUCLID_CDK_ARCHIVE}.zip" --format=zip "${EUCLID_CDK_ARCHIVE}"
          else
            cmake -E tar czf "../${EUCLID_CDK_ARCHIVE}.tar.gz" "${EUCLID_CDK_ARCHIVE}"
          fi

      # -------------------------------------------------------------------------
      # Installers. The same tree the archive holds, laid out the way each
      # platform expects it to arrive: under /usr for a distribution package,
      # /usr/local for a macOS pkg, Program Files for an MSI.
      #
      # Built on every run and not only for a tag, for the reason staging is: a
      # packaging step that stopped working is better found on the commit that
      # broke it than on the tag that wanted to ship it.
      # -------------------------------------------------------------------------

      - name: Stage the package root
        shell: bash
        run: |
          set -euo pipefail
          # A second install rather than a copy of the archive's stage, because each platform
          # wants the tree under a different prefix and CMake is what relocates it - the installed
          # package config resolves its paths relative to itself, so an install is the one way to
          # move it that keeps find_package() working.
          case "${{ runner.os }}" in
            Linux)   prefix="pkgroot/usr" ;;
            macOS)   prefix="pkgroot/usr/local" ;;
            Windows) prefix="pkgroot" ;;
          esac
          cmake --install build --config Release --prefix "$prefix"

          # The licence and the README belong under share/doc on a Unix prefix, not at its root: a
          # package dropping files straight into /usr is one no distribution would take, and
          # /usr/LICENSE would be a file from this project sitting where nothing looks for one. An
          # MSI's install folder is a directory of its own, so there they stay where they land.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp LICENSE README.md "$prefix/"
          else
            install -d "$prefix/share/doc/euclid-cdk"
            cp LICENSE README.md "$prefix/share/doc/euclid-cdk/"
          fi
          echo "EUCLID_CDK_VERSION=$(cat version.txt)" >> "$GITHUB_ENV"

      - name: Install fpm
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      # One package carrying the libraries and the headers together, rather than the runtime/-dev
      # split a distribution would make. What is shipped here is an SDK: nothing on a euclid machine
      # loads libeuclid-cdk.so without having been built against these headers first, so a runtime
      # package on its own would have no user.
      #
      # Boost and OpenSSL are named as dependencies of neither package, deliberately: the release
      # build takes both from vcpkg, whose Linux triplet is static, so they are inside the library
      # rather than beside it. The step prints what the library actually asks the loader for, so
      # that a declared dependency list which has drifted from the truth is visible in the log
      # rather than discovered on an install.
      - name: Build the DEB and RPM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          common=(
            -s dir
            -C pkgroot
            --name euclid-cdk
            --version "${EUCLID_CDK_VERSION}"
            --license Apache-2.0
            --vendor "Jens Vogt"
            --maintainer "Jens Vogt <jensvogt47@gmail.com>"
            --url "https://github.com/jensvogt/euclid-cdk"
            --description "C++ SDK for a euclid server: headers, shared and static libraries, and the CMake package config."
            usr
          )
          # The architecture is named per target: the same machine is "amd64" to dpkg and
          # "x86_64" to rpm, and a package labelled with the other one installs nowhere. fpm
          # translates between them for some targets and not others, so neither is left to it.
          fpm -t deb --architecture amd64 --depends libstdc++6 \
              --package "euclid-cdk-${EUCLID_CDK_VERSION}-amd64.deb" "${common[@]}"
          fpm -t rpm --architecture x86_64 --depends libstdc++ \
              --package "euclid-cdk-${EUCLID_CDK_VERSION}-x86_64.rpm" "${common[@]}"

          # Read back rather than trusted: fpm answers 0 for a package it wrote with nothing in
          # it, and an empty package is the failure that looks like success all the way to
          # somebody installing it.
          deb="euclid-cdk-${EUCLID_CDK_VERSION}-amd64.deb"
          rpmfile="euclid-cdk-${EUCLID_CDK_VERSION}-x86_64.rpm"
          dpkg --contents "$deb" | grep -q "usr/include/euclid/cdk/Euclid.h"
          dpkg --contents "$deb" | grep -q "usr/lib/cmake/euclid-cdk/"
          rpm -qlp "$rpmfile" | grep -q "usr/include/euclid/cdk/Euclid.h"

          echo "shared libraries libeuclid-cdk.so asks for:"
          needed="$(objdump -p pkgroot/usr/lib/libeuclid-cdk.so | awk '/NEEDED/ {print $2}')"
          echo "${needed}" | sed 's/^/  /'

          # Refused rather than printed and shipped. The packages name no Boost or OpenSSL
          # dependency because the release build has them statically; if that ever stops being
          # true the package is broken for everybody who installs it, and the only symptom is a
          # loader error on first use. Cheaper to stop here and make somebody decide.
          if echo "${needed}" | grep -qE 'libboost|libssl|libcrypto'; then
            echo "The library links Boost or OpenSSL dynamically, which these packages do not" >&2
            echo "declare. Either build them statically or add the dependencies to fpm above." >&2
            exit 1
          fi

      # A component package, installed at "/" over a root that already says usr/local - so the pkg
      # puts the SDK exactly where a macOS build looks for it without an install-location to argue
      # with.
      #
      # Not signed for Gatekeeper: productsign needs an Apple Developer ID certificate, which this
      # project has none of. The detached GPG signature the deploy job writes is what a caller can
      # actually check; macOS will still ask before opening it.
      - name: Build the macOS pkg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          pkgbuild --root pkgroot \
                   --identifier de.jensvogt.euclid-cdk \
                   --version "${EUCLID_CDK_VERSION}" \
                   --install-location / \
                   "euclid-cdk-${EUCLID_CDK_VERSION}-macos-arm64.pkg"

      # Pinned, because the latest is WiX 7 and the .wxs here is written against the v4 schema
      # that 4 and 5 share. Into a path of its own rather than --global, so calling it does not
      # depend on whether the runner happens to have the dotnet tools directory on PATH.
      - name: Install the WiX toolset
        if: runner.os == 'Windows'
        run: dotnet tool install wix --version 5.0.2 --tool-path "${{ runner.temp }}\wix"

      # Not signed with Authenticode, for the same reason the pkg is not signed for Gatekeeper:
      # that needs a code-signing certificate this project does not have. SmartScreen will warn.
      - name: Build the MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'pkgroot'
          & "$env:RUNNER_TEMP\wix\wix.exe" build `
            -arch x64 `
            -d "Version=$env:EUCLID_CDK_VERSION" `
            -d "Stage=$stage" `
            -o "euclid-cdk-$env:EUCLID_CDK_VERSION-windows-x64.msi" `
            dist/windows/euclid-cdk.wxs

      # Unpacked and read back, for the same reason the DEB and RPM are. WiX's Files element
      # harvests the tree with a ** glob, and its documentation does not actually say whether the
      # subdirectory structure survives into the package - so an MSI that flattened every header
      # into one folder would build, install, and only fail at the first #include. An
      # administrative install extracts without installing anything, and needs no elevation.
      - name: Check the MSI lays the tree out correctly
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = "euclid-cdk-$env:EUCLID_CDK_VERSION-windows-x64.msi"
          $extract = Join-Path $env:RUNNER_TEMP 'msi-extract'
          $log = Join-Path $env:RUNNER_TEMP 'msi-extract.log'

          $p = Start-Process msiexec -Wait -PassThru -ArgumentList @(
            '/a', (Resolve-Path $msi).Path, '/qn', "TARGETDIR=$extract", '/l*v', $log)
          if ($p.ExitCode -ne 0) {
            Get-Content $log -Tail 40
            throw "the administrative install failed with $($p.ExitCode)"
          }

          # The two paths that say the structure survived: a header several directories deep, and
          # the package config a consumer's find_package() has to land on.
          $wanted = @(
            'euclid-cdk\include\euclid\cdk\Euclid.h',
            'euclid-cdk\include\euclid\cdk\dto\Esm.h',
            'euclid-cdk\lib\cmake\euclid-cdk\euclid-cdk-config.cmake'
          )
          $missing = @()
          foreach ($w in $wanted) {
            if (-not (Get-ChildItem -Path $extract -Recurse -Filter (Split-Path $w -Leaf) -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -like "*$w" })) { $missing += $w }
          }
          if ($missing.Count -gt 0) {
            Write-Host "The MSI does not lay the tree out as expected. Missing:"
            $missing | ForEach-Object { Write-Host "  $_" }
            Write-Host "What it actually contains:"
            Get-ChildItem -Path $extract -Recurse -File |
              ForEach-Object { Write-Host "  $($_.FullName.Substring($extract.Length))" }
            throw 'MSI layout check failed'
          }
          Write-Host "MSI layout verified: headers and the CMake package config keep their paths."

      # Only for a tag, since only a tag has a release to attach them to. A main run has already
      # done its job by this point - the cache is written whether or not the archive is kept - and
      # staging and archiving are still worth doing there, because an install tree that stopped
      # building is better found on the commit that broke it than on the tag that wanted to ship it.
      - name: Upload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EUCLID_CDK_ARCHIVE }}
          path: |
            euclid-cdk-*.tar.gz
            euclid-cdk-*.zip
          if-no-files-found: error

      - name: Upload the installers
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            euclid-cdk-*.deb
            euclid-cdk-*.rpm
            euclid-cdk-*.pkg
            euclid-cdk-*.msi
          if-no-files-found: error

  release:
    name: Attach to the release
    runs-on: ubuntu-latest
    needs: package
    # A manual run builds the archives and stops there: there is no tag to attach them to.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      # Creates the release when the tag has none, and otherwise leaves the one that is there alone
      # - so a release written by hand keeps its notes and only gains the archives.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
                --title "euclid-cdk ${GITHUB_REF_NAME#v}" \
                --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" archives/* --clobber

  # ---------------------------------------------------------------------------
  # Signs the installers and attaches them. A job of its own, and the only one
  # the signing key is given to: the archives are built on three runners, and a
  # key that travelled to all of them would be exposed three times over for no
  # gain. The installers come back as artifacts, get signed here, and go up.
  #
  # The key is the one euclid-rui signs its APT repository with, so anybody who
  # already trusts euclid-rui's key trusts these too - the same three secrets,
  # which have to be readable from this repository as well (organisation
  # secrets, or copied into it).
  # ---------------------------------------------------------------------------
  deploy:
    name: Sign and attach the installers
    runs-on: ubuntu-latest
    # After release, not beside it: that job is what creates the release when a
    # tag has none, and uploading to one that does not exist yet fails.
    needs: [ package, release ]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      # Everything, not only the installers: the archives are on the release too, and a checksum
      # file that covered half of what is published would be worse than none - somebody checking a
      # tarball against it would find it missing and have no way to tell that from a tampered file.
      # The archives are attached by the release job; this only vouches for them.
      - name: Download every artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The rpm package is what carries "rpm --addsign"; nothing here builds an RPM.
      - name: Install rpm
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      # Refused rather than silently unsigned: a release whose signatures are missing because a
      # secret was not set is worse than one that failed, because nothing afterwards says so.
      - name: Check the signing key is available
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${KEY}" ] || [ -z "${KEY_ID}" ]; then
            echo "APT_GPG_PRIVATE_KEY and APT_GPG_KEY_ID must be set for this repository -" >&2
            echo "they are the key euclid-rui signs with. Nothing was signed or attached." >&2
            exit 1
          fi

      # Through stdin rather than as an argument, here and for the passphrase below: an argument
      # is readable in "ps" by anything else running on the runner, and a private key is the one
      # value in this workflow that would be worth reading.
      - name: Import the signing key
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: printf '%s' "${KEY}" | gpg --batch --import

      # Inside the package rather than beside it, because that is the only signature "rpm -K" and
      # dnf can check on their own. The DEB gets no in-package signature: dpkg checks none on a
      # plain install, and an APT repository - which is where a signed index would matter - is
      # euclid-rui's job rather than this one's.
      - name: Sign the RPM
        env:
          KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
          PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          # In a file with no permissions for anybody else, rather than in the sign command: a
          # passphrase in the command line is readable in "ps" by every other process on the
          # runner for as long as rpm runs.
          pass_file="$(mktemp)"
          chmod 600 "$pass_file"
          printf '%s' "${PASSPHRASE}" > "$pass_file"
          trap 'rm -f "$pass_file"' EXIT

          for rpmfile in artifacts/*.rpm; do
            [ -e "$rpmfile" ] || continue

            # "%{__gpg} gpg" is not a typo and not a doubled word: rpm takes the first token as the
            # program to run and the rest as its arguments, so the second one is argv[0]. The
            # default macro reads the same way.
            rpm --define "_gpg_name ${KEY_ID}" \
                --define "__gpg_sign_cmd %{__gpg} gpg --batch --yes --pinentry-mode loopback --passphrase-file ${pass_file} --no-armor --no-secmem-warning --detach-sign -u %{_gpg_name} -o %{__signature_filename} %{__plaintext_filename}" \
                --addsign "$rpmfile"

            # Asked for the signature itself rather than grepped out of "rpm -qpi", which prints a
            # Signature line for an unsigned package too - saying "(none)". A check that passes
            # either way is not a check.
            signature="$(rpm -qp --queryformat '%{SIGPGP:pgpsig}' "$rpmfile")"
            case "${signature}" in
              ''|'(none)')
                echo "$rpmfile came back unsigned" >&2
                exit 1
                ;;
            esac
            echo "$rpmfile signed: ${signature}"
          done

      # One signature over the checksums rather than one per file: a caller checks the list and
      # then the file they actually took, which is two commands whatever they downloaded - and the
      # list is what says a file is missing as well as that it is wrong.
      - name: Write and sign the checksums
        working-directory: artifacts
        env:
          KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
          PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          # Everything published under the release's own name: the four installers and the three
          # archives. "euclid-cdk.gpg.asc" is not matched by the glob and would be pointless in
          # the list anyway - a checksum of the key, signed by the key, says nothing.
          sha256sum euclid-cdk-* > SHA256SUMS

          printf '%s' "${PASSPHRASE}" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 \
              --default-key "${KEY_ID}" \
              --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS

          # The public half, so verifying needs nothing but the release page. The same key
          # euclid-rui publishes, under this project's name.
          gpg --export --armor "${KEY_ID}" > euclid-cdk.gpg.asc

          # Checked here rather than left to whoever downloads it: a signature written with the
          # wrong key, or over a file that changed afterwards, is something this job can catch and
          # nobody else will until it matters.
          gpg --batch --yes --verify SHA256SUMS.asc SHA256SUMS
          cat SHA256SUMS

      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
             artifacts/euclid-cdk-*.deb \
             artifacts/euclid-cdk-*.rpm \
             artifacts/euclid-cdk-*.pkg \
             artifacts/euclid-cdk-*.msi \
             artifacts/SHA256SUMS \
             artifacts/SHA256SUMS.asc \
             artifacts/euclid-cdk.gpg.asc \
             --clobber

  # ---------------------------------------------------------------------------
  # Publishes the signed packages into an APT and a YUM repository, so a euclid
  # machine installs the SDK with the package manager it already has and picks
  # up later releases with an ordinary update.
  #
  # Both repositories live on one gh-pages branch, under apt/ and yum/, and are
  # rebuilt from everything the branch already holds rather than from this
  # release alone - so older versions stay installable and "apt install
  # euclid-cdk=0.14.0" keeps working.
  #
  # After deploy, not beside it, and the order matters: the RPM a yum client
  # checks is the one deploy signed. Publishing the unsigned package would give
  # every "yum install" a signature error, which is the correct response to it.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish the APT and YUM repositories
    runs-on: ubuntu-latest
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')

    env:
      PAGES_BRANCH: gh-pages
      APT_DIST: stable
      APT_COMPONENT: main
      APT_ARCH: amd64

    steps:
      - name: Install the repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c gnupg

      # From the release rather than from the build artifacts: the release holds the packages as
      # they were signed, and the signature inside the RPM is the whole point of this job.
      - name: Download the signed packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          gh release download "${GITHUB_REF_NAME}" --dir incoming \
             --pattern 'euclid-cdk-*.deb' --pattern 'euclid-cdk-*.rpm'
          ls -l incoming

      - name: Check the signing key is available
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${KEY}" ] || [ -z "${KEY_ID}" ]; then
            echo "APT_GPG_PRIVATE_KEY and APT_GPG_KEY_ID must be set: an unsigned repository is" >&2
            echo "one apt and dnf both refuse, so nothing was published." >&2
            exit 1
          fi

      - name: Import the signing key
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: printf '%s' "${KEY}" | gpg --batch --import

      # Cloned when it exists so that what is already published survives, and started empty the
      # first time. Single-branch and shallow: the history of a package repository is of no
      # interest to this job, and a full clone of one grows with every release.
      - name: Check out or start the pages branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" "${PAGES_BRANCH}" >/dev/null 2>&1; then
            git clone --branch "${PAGES_BRANCH}" --single-branch --depth 1 \
                "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pages
          else
            mkdir pages
            git -C pages init -b "${PAGES_BRANCH}"
          fi
          mkdir -p pages/apt/pool/main/e/euclid-cdk pages/yum

      - name: Add the packages
        run: |
          set -euo pipefail
          cp incoming/euclid-cdk-*.deb pages/apt/pool/main/e/euclid-cdk/
          cp incoming/euclid-cdk-*.rpm pages/yum/

      # Regenerated over the whole pool, not appended to: the indices describe what is there, and
      # one built from this release alone would make every earlier version disappear from apt.
      - name: Build the APT indices
        working-directory: pages/apt
        run: |
          set -euo pipefail
          dist_dir="dists/${APT_DIST}/${APT_COMPONENT}/binary-${APT_ARCH}"
          mkdir -p "$dist_dir"

          apt-ftparchive packages pool > "$dist_dir/Packages"
          gzip -9kf "$dist_dir/Packages"

          # Written out rather than defaulted, because apt refuses a Release that does not say
          # which suite and architectures it is for.
          {
            printf 'APT::FTPArchive::Release::Origin "euclid";\n'
            printf 'APT::FTPArchive::Release::Label "euclid-cdk";\n'
            printf 'APT::FTPArchive::Release::Suite "%s";\n' "${APT_DIST}"
            printf 'APT::FTPArchive::Release::Codename "%s";\n' "${APT_DIST}"
            printf 'APT::FTPArchive::Release::Architectures "%s";\n' "${APT_ARCH}"
            printf 'APT::FTPArchive::Release::Components "%s";\n' "${APT_COMPONENT}"
            printf 'APT::FTPArchive::Release::Description "The C++ SDK for a euclid server";\n'
          } > apt-ftparchive.conf
          apt-ftparchive -c apt-ftparchive.conf release "dists/${APT_DIST}" > "dists/${APT_DIST}/Release"
          rm apt-ftparchive.conf

      # Both forms, because which one a client wants depends on its age: InRelease is the clearsigned
      # file apt prefers, Release.gpg the detached signature older ones look for.
      #
      # Nothing signs the .deb itself, and nothing needs to: the Release file is signed, it carries
      # the checksum of Packages, and Packages carries the checksum of every .deb. Breaking any link
      # in that chain is what apt reports.
      - name: Sign the APT indices
        working-directory: pages/apt
        env:
          KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
          PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          release="dists/${APT_DIST}/Release"
          printf '%s' "${PASSPHRASE}" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --default-key "${KEY_ID}" -abs -o "${release}.gpg" "${release}"
          printf '%s' "${PASSPHRASE}" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --default-key "${KEY_ID}" --clearsign -o "dists/${APT_DIST}/InRelease" "${release}"
          gpg --batch --yes --verify "${release}.gpg" "${release}"

      - name: Build and sign the YUM metadata
        working-directory: pages/yum
        env:
          KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
          PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Regenerated whole rather than --update: there is no existing metadata the first time,
          # and with a handful of packages the saving from reusing checksums is not worth a second
          # code path that only runs once.
          createrepo_c .

          # repo_gpgcheck=1 is what checks this; gpgcheck=1 checks the signature deploy put inside
          # the package. The two are different claims - that the index is ours, and that the package
          # is - and a repository worth trusting makes both.
          printf '%s' "${PASSPHRASE}" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
              --default-key "${KEY_ID}" --armor --detach-sign --output repodata/repomd.xml.asc \
              repodata/repomd.xml
          gpg --batch --yes --verify repodata/repomd.xml.asc repodata/repomd.xml

      # The key, and a ready-made source file for each package manager, so following the README is
      # a copy rather than a transcription.
      - name: Write the key and the client configuration
        working-directory: pages
        env:
          KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          # Derived from GITHUB_REPOSITORY rather than the event payload, which differs in shape
          # between the events this workflow answers to.
          base="https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}"

          gpg --export --armor "${KEY_ID}" > euclid-cdk.gpg.asc

          printf 'deb [signed-by=/usr/share/keyrings/euclid-cdk.gpg] %s/apt %s %s\n' \
                 "$base" "${APT_DIST}" "${APT_COMPONENT}" > euclid-cdk.list

          {
            printf '[euclid-cdk]\n'
            printf 'name=euclid-cdk\n'
            printf 'baseurl=%s/yum\n' "$base"
            printf 'enabled=1\n'
            printf 'gpgcheck=1\n'
            printf 'repo_gpgcheck=1\n'
            printf 'gpgkey=%s/euclid-cdk.gpg.asc\n' "$base"
          } > euclid-cdk.repo

          # Pages would otherwise run the tree through Jekyll, which skips directories beginning
          # with an underscore and has been known to rewrite what it serves. A package index has to
          # arrive byte for byte.
          : > .nojekyll

      - name: Commit and push
        working-directory: pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The repositories already describe this release; nothing to push."
            exit 0
          fi
          git commit -m "chore: publish euclid-cdk ${GITHUB_REF_NAME#v} to the apt and yum repositories"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
              "HEAD:${PAGES_BRANCH}"
